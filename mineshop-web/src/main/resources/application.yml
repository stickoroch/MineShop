spring:
  config:
    import:
      - 'classpath:localization.yml'
  devtools:
    restart:
      enabled: false
  application:
    name: MineShop
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    #url: jdbc:postgresql://localhost:5432/mc
    #username: postgres
    #password: root
    url: jdbc:h2:file:./db/local_db
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    properties.hibernate.hbm2ddl.create_namespaces: true
    hibernate:
      ddl-auto: update

